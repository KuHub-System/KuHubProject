# ======================================================================
# PERFIL DEV — logging detallado para depuración local
# ======================================================================
# Activar junto al perfil de datasource local: SPRING_PROFILES_ACTIVE=mat,dev
# (los perfiles se combinan; "mat" sigue aportando el datasource de cada dev)

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.KuHub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
