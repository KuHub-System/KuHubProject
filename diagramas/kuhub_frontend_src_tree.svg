<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Estructura de carpetas — frontend/src (KuHub)</title>
<desc>Árbol de directorios de frontend/src: 13 carpetas de primer y segundo nivel con conteo de archivos, más 4 archivos raíz.</desc>
<defs>
<style>
  .bg { fill: #12161c; }
  .card { fill: #181e27; stroke: #2a3240; stroke-width: 1; }
