  .line { stroke: #3a4456; stroke-width: 1.5; fill: none; }
  .root-label { font-family: 'SF Mono','Consolas',ui-monospace,monospace; font-size: 20px; font-weight: 700; fill: #f2c98a; }
  .folder { font-family: 'SF Mono','Consolas',ui-monospace,monospace; font-size: 15px; font-weight: 600; fill: #ecebe6; }
  .subfolder { font-family: 'SF Mono','Consolas',ui-monospace,monospace; font-size: 13px; font-weight: 500; fill: #c7cdd8; }
  .count { font-family: 'Segoe UI',system-ui,sans-serif; font-size: 11px; fill: #7c8697; }
  .badge-bg { fill: #e8965a; }
  .badge-txt { font-family: 'Segoe UI',system-ui,sans-serif; font-size: 11px; font-weight: 700; fill: #12161c; }
  .file-tag { font-family: 'Segoe UI',system-ui,sans-serif; font-size: 10.5px; fill: #6b7484; }
  .heading { font-family: 'Segoe UI',system-ui,sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; fill: #7c8697; text-transform: uppercase; }
</style>
